<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 16 16" shape-rendering="crispEdges" role="img" aria-labelledby="skull-title">
  <!-- Skull logo, candidate A "Classic": 16x16 sprite - domed cranium, deep sockets with one terracotta glint, triangular nasal aperture, three-tooth jaw. -->
  <!-- Hand-placed 16x16 pixel grid; every rect sits on integer cells. Base fills read on light; the media query re-tunes them for dark. -->
  <title id="skull-title">Skull</title>
  <style>@media (prefers-color-scheme: dark){.o{fill:#544A3D}.b{fill:#F2ECDC}.s{fill:#C6B896}.k{fill:#0B0906}.w{fill:#FCF8ED}.a{fill:#E08A66}}</style>
  <g class="o" fill="#2A231C"><rect x="4" y="0" width="8" height="1"/><rect x="2" y="1" width="2" height="1"/><rect x="12" y="1" width="2" height="1"/><rect x="1" y="2" width="1" height="10"/><rect x="14" y="2" width="1" height="10"/><rect x="2" y="12" width="2" height="1"/><rect x="12" y="12" width="2" height="1"/><rect x="3" y="13" width="1" height="2"/><rect x="12" y="13" width="1" height="2"/><rect x="4" y="15" width="8" height="1"/></g>
  <g class="b" fill="#EBE4D3"><rect x="4" y="1" width="8" height="4"/><rect x="2" y="2" width="2" height="3"/><rect x="12" y="2" width="2" height="3"/><rect x="2" y="5" width="1" height="7"/><rect x="7" y="5" width="2" height="4"/><rect x="13" y="5" width="1" height="7"/><rect x="3" y="9" width="4" height="1"/><rect x="9" y="9" width="4" height="1"/><rect x="3" y="10" width="3" height="2"/><rect x="10" y="10" width="3" height="2"/><rect x="6" y="11" width="4" height="2"/><rect x="4" y="12" width="2" height="1"/><rect x="10" y="12" width="2" height="1"/></g>
  <g class="s" fill="#C4B593"><rect x="3" y="5" width="4" height="1"/><rect x="9" y="5" width="4" height="1"/></g>
  <g class="k" fill="#171310"><rect x="3" y="6" width="4" height="3"/><rect x="9" y="6" width="4" height="1"/><rect x="9" y="7" width="1" height="2"/><rect x="11" y="7" width="2" height="2"/><rect x="10" y="8" width="1" height="1"/><rect x="7" y="9" width="2" height="2"/><rect x="6" y="10" width="1" height="1"/><rect x="9" y="10" width="1" height="1"/><rect x="6" y="13" width="1" height="2"/><rect x="9" y="13" width="1" height="2"/></g>
  <g class="w" fill="#F7F2E4"><rect x="4" y="13" width="2" height="2"/><rect x="7" y="13" width="2" height="2"/><rect x="10" y="13" width="2" height="2"/></g>
  <g class="a" fill="#D97757"><rect x="10" y="7" width="1" height="1"/></g>
</svg>
